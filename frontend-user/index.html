<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主菜单 -->
    <div class="main-menu" id="main-menu">
        <div class="menu-content">
            <h1 class="menu-title">🎮 斗地主小游戏</h1>
            <div class="menu-buttons">
                <button id="start-game-btn" class="menu-btn btn-primary">开始游戏</button>
                <button id="game-rules-btn" class="menu-btn btn-secondary">游戏规则</button>
            </div>
        </div>
        
        <!-- 游戏规则对话框（放在主菜单内，确保可以显示） -->
        <div class="rules-modal" id="rules-modal" style="display: none;">
            <div class="modal-content">
                <h3>游戏规则</h3>
                <div class="rules-content">
                    <h4>基本规则</h4>
                    <ul>
                        <li>3个玩家，每人17张牌，3张底牌</li>
                        <li>通过抢地主确定地主，地主获得3张底牌</li>
                        <li>地主先出牌，然后按顺序出牌</li>
                        <li>可以出单张、对子、三张、炸弹等牌型</li>
                        <li>第一个出完牌的玩家获胜</li>
                    </ul>
                </div>
                <button id="close-rules-btn" class="btn btn-primary">关闭</button>
            </div>
        </div>
    </div>

    <!-- 游戏界面 -->
    <div class="game-container" id="game-container" style="display: none;">
        <div class="game-header">
            <h1>斗地主小游戏</h1>
            <button id="back-to-menu-btn" class="btn-back">返回主菜单</button>
        </div>
        
        <!-- 流程提示 -->
        <div class="game-status" id="game-status">
            <div class="status-message" id="status-message">等待开始游戏...</div>
        </div>
        
        <div class="main-layout">
            <!-- 左侧游戏区域 -->
            <div class="game-area">
                <div class="game-info">
                    <div class="player-info">
                        <div class="player" id="player-left">
                            <h3>玩家1</h3>
                            <div class="card-count">手牌: <span id="count-left">0</span></div>
                            <div class="cards-display" id="cards-left"></div>
                        </div>
                        
                        <div class="player" id="player-top">
                            <h3>玩家2</h3>
                            <div class="card-count">手牌: <span id="count-top">0</span></div>
                            <div class="cards-display" id="cards-top"></div>
                        </div>
                    </div>
                    
                    <div class="center-area">
                        <div class="bottom-cards">
                            <h3>底牌</h3>
                            <div class="cards-display" id="bottom-cards"></div>
                        </div>
                        
                        <div class="played-cards">
                            <h3>已出牌</h3>
                            <div class="cards-display" id="played-cards"></div>
                        </div>
                    </div>
                    
                    <div class="player" id="player-self">
                        <h3>我 (下)</h3>
                        <div class="card-count">手牌: <span id="count-self">0</span></div>
                        <div class="cards-display" id="cards-self"></div>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="deal-btn" class="btn btn-primary">发牌</button>
                    <button id="bid-landlord-btn" class="btn btn-success" style="display: none;">抢地主</button>
                    <button id="no-bid-btn" class="btn btn-warning" style="display: none;">不抢</button>
                    <button id="play-btn" class="btn btn-success" disabled>出牌</button>
                    <button id="pass-btn" class="btn btn-warning" disabled>不要</button>
                    <!-- 作弊功能快捷按钮（仅在作弊模式下显示） -->
                    <div id="cheat-quick-buttons" style="display: none;">
                        <button id="cheat-action-btn" class="btn btn-danger" style="font-size: 12px; padding: 8px 12px;"></button>
                    </div>
                </div>
            </div>
            
            <!-- 右侧操作记录区域 -->
            <div class="log-area">
                <h2>操作记录</h2>
                <div class="message-area" id="message-area"></div>
            </div>
        </div>
        
        <!-- 作弊询问对话框 -->
        <div class="cheat-modal" id="cheat-modal" style="display: none;">
            <div class="modal-content">
                <h3>选择作弊方式</h3>
                <p>请选择一种作弊方式（只能选择一种，选择后不可更改）</p>
                <div class="modal-buttons">
                    <button id="cheat-view-all-btn" class="btn btn-danger">查看所有手牌</button>
                    <button id="cheat-best-cards-btn" class="btn btn-danger">获得最好手牌</button>
                    <button id="no-cheat-btn" class="btn btn-primary">不开启作弊</button>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- 模块化脚本 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
